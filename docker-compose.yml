services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: notifications
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/notifications
    ports:
      - "8020:8000"
    volumes:
      - .:/app
      - /app/.venv

  frontend:
    build: ./frontend
    depends_on:
      - app
    environment:
      VITE_API_URL: http://localhost:8020
    ports:
      - "5190:5190"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
